services:
  web:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ALLOWED_HOSTS=solveny.dev,www.solveny.dev
      - PICKABLE_PUBLIC_URL=https://solveny.dev
      - PICKABLE_MCP_SCAN_ENABLED=${PICKABLE_MCP_SCAN_ENABLED:-0}
      - PICKABLE_AGENT_API_KEY=${PICKABLE_AGENT_API_KEY:-}
      - PICKABLE_SCANS_PER_HOUR=${PICKABLE_SCANS_PER_HOUR:-5}
      - PICKABLE_GLOBAL_SCANS_PER_HOUR=${PICKABLE_GLOBAL_SCANS_PER_HOUR:-30}
      - PICKABLE_INTEL_REUSE_HOURS=${PICKABLE_INTEL_REUSE_HOURS:-24}
      - PICKABLE_DEEP_PER_DAY=${PICKABLE_DEEP_PER_DAY:-50}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      - INTELLIGENCE_PROVIDER=${INTELLIGENCE_PROVIDER:-unavailable}
      # Hosted product-analysis credentials (only used when provider=openai).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_QUICK_MODEL=${OPENAI_QUICK_MODEL:-gpt-6-luna}
      - OPENAI_DEEP_MODEL=${OPENAI_DEEP_MODEL:-gpt-6.1-sol}
      # Trust Traefik/docker (default private ranges) so per-client rate limits
      # and IP-scoped reads use CF-Connecting-IP / X-Forwarded-For.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # After Cloudflare proxy (orange cloud) is ON, set to 1 so direct-to-IP
      # requests that bypass the edge are rejected at the app (health exempt).
      - PICKABLE_REQUIRE_CF=${PICKABLE_REQUIRE_CF:-0}
    volumes:
      # Image runs as non-root uid 1000; host ./data must be writable by it
      # (e.g. chown -R 1000:1000 ./data on first deploy if sqlite open fails).
      - ./data:/app/data
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pickable-http.entrypoints=web"
      - "traefik.http.routers.pickable-http.middlewares=redirect-to-https"
      - "traefik.http.routers.pickable-http.rule=Host(`solveny.dev`) || Host(`www.solveny.dev`)"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.pickable-https.entrypoints=websecure"
      - "traefik.http.routers.pickable-https.rule=Host(`solveny.dev`) || Host(`www.solveny.dev`)"
      - "traefik.http.routers.pickable-https.tls=true"
      - "traefik.http.routers.pickable-https.tls.certresolver=myhttpchallenge"
      - "traefik.http.services.pickable.loadbalancer.server.port=8765"
      - "traefik.docker.network=root_default"
      # Edge security headers (defense in depth; app sends the same set).
      - "traefik.http.middlewares.pickable-secure.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.pickable-secure.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.pickable-secure.headers.stsPreload=true"
      - "traefik.http.middlewares.pickable-secure.headers.frameDeny=true"
      - "traefik.http.middlewares.pickable-secure.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.pickable-secure.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.pickable-https.middlewares=pickable-secure"

networks:
  root_default:
    external: true
