# Render Blueprint: free Python web service, no dependencies to install.
# Free instances sleep after ~15 min idle; the first request then takes ~1 min to wake.
services:
  - type: web
    name: pickable
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: python3 server.py
    healthCheckPath: /api/health
    envVars:
      - key: BIND
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ALLOWED_HOSTS
        value: solveny.dev,www.solveny.dev
      - key: PICKABLE_PUBLIC_URL
        value: https://solveny.dev
      - key: PICKABLE_MCP_SCAN_ENABLED
        value: "0"
      - key: PICKABLE_SCANS_PER_HOUR
        value: "5"
      - key: PICKABLE_GLOBAL_SCANS_PER_HOUR
        value: "30"
